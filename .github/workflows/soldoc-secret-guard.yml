# soldoc-secret-guard CI — proactively adopted from ai-infra (Layer 3 backstop).
#
# Server-side backstop for the machine-local pre-commit hook: on every push and
# pull_request, scan EVERY tracked docs/solutions/**/*.md (WHOLE TREE, not just a
# diff) for a residual plaintext blocking secret and fail the build on any finding.
# This is the defense that a staged-diff-only gitleaks scan lacks — a diff scan
# never re-scans an already-committed file, so a secret that lands once is never
# caught again. This whole-tree scan closes that gap (the same gap that let a live
# Stripe key sit in a committed solution doc in the sibling `chp` repo).
#
# Runs the SAME guard the pre-commit hook uses
# (scripts/precommit-soldoc-secret-guard.py --all). On GitHub-hosted runners the
# ai-infra modules (src.pipeline.doc_redaction_gate / src.lib.secret_patterns) are
# NOT present in this repo, so the guard degrades gracefully to a gitleaks-only
# whole-tree scan — still real coverage. Self-contained: pins gitleaks, needs no
# repo secrets. Findings are reported as fingerprints only — never a raw secret.
#
# NOTE: this repo currently tracks ZERO solution docs; this workflow is proactive
# future-proofing. It activates the moment a docs/solutions/**/*.md file (or the
# guard script itself) is added or changed.
name: soldoc-secret-guard

on:
  push:
    # Restricted to the default branch 2026-08-26. This repo is PUBLIC, so
    # `pull_request` has to stay (see the concurrency note below), and with both
    # triggers unfiltered every commit on an in-repo PR branch fired a SECOND
    # identical whole-tree scan for the identical verdict. Scoping `push` to the
    # default branch makes that overlap structurally UNREACHABLE for in-repo
    # branches rather than merely cancelled after the fact; the concurrency group
    # below covers the one residual case, a PR whose own head branch is `main`.
    # Path filters are untouched — this changes WHEN the guard fires, never WHAT
    # it scans.
    branches:
      - main
    paths:
      - "docs/solutions/**/*.md"
      - "scripts/precommit-soldoc-secret-guard.py"
      - ".github/workflows/soldoc-secret-guard.yml"
  pull_request:
    paths:
      - "docs/solutions/**/*.md"
      - "scripts/precommit-soldoc-secret-guard.py"
      - ".github/workflows/soldoc-secret-guard.yml"
  workflow_dispatch: {}

# Keyed on the HEAD COMMIT, not on `github.ref`. This repo is PUBLIC, so
# `pull_request` must stay: an outside contributor's PR arrives from a fork and
# a fork head is NOT covered by the `push` trigger. But a ref-keyed group would
# NOT dedupe, because the same commit carries two different refs — a push is
# `refs/heads/<branch>` while a pull_request is `refs/pull/<n>/merge`. Keying on
# the head SHA (`github.event.pull_request.head.sha` on a PR event, `github.sha`
# on a push) puts both events for one commit in ONE group, so the second to
# start cancels the first and exactly one whole-tree scan survives.
#
# Cancelling is safe for THIS workflow specifically because the guard scans the
# entire tracked tree, not a diff: any surviving run for that commit reaches the
# identical verdict, so a cancelled run can never let a secret through unscanned.
concurrency:
  group: soldoc-secret-guard-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soldoc-secret-guard:
    runs-on: ubuntu-latest
    # Hard cap so a wedged gitleaks download or a hung scan cannot inherit
    # GitHub's 6-hour default. This job averages well under a minute.
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Downloading $url"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version

      - name: Scan all solution docs for residual secrets
        env:
          # On a GitHub-hosted runner ai-infra is NOT checked out, so this is a
          # documented no-op: the guard cannot import the authoritative scan and
          # degrades to a gitleaks-only whole-tree scan. Kept for parity with the
          # ai-infra source workflow and so a self-hosted runner that DOES have
          # ai-infra could point it at that checkout for full coverage.
          AI_INFRA_ROOT: /home/goduk/ai-infra
        run: |
          set -euo pipefail
          # Point the guard at the pinned gitleaks ($HOME is expanded here, not
          # in the env: block above).
          export DOC_GATE_GITLEAKS_BIN="$HOME/.local/bin/gitleaks"
          python3 scripts/precommit-soldoc-secret-guard.py --all
          echo "soldoc-secret-guard: all tracked solution docs are clean."
