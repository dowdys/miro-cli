# soldoc-secret-guard CI — proactively adopted from ai-infra (Layer 3 backstop).
#
# Server-side backstop for the machine-local pre-commit hook: on every push and
# pull_request, scan EVERY tracked docs/solutions/**/*.md (WHOLE TREE, not just a
# diff) for a residual plaintext blocking secret and fail the build on any finding.
# This is the defense that a staged-diff-only gitleaks scan lacks — a diff scan
# never re-scans an already-committed file, so a secret that lands once is never
# caught again. This whole-tree scan closes that gap (the same gap that let a live
# Stripe key sit in a committed solution doc in the sibling `chp` repo).
#
# Runs the SAME guard the pre-commit hook uses
# (scripts/precommit-soldoc-secret-guard.py --all). On GitHub-hosted runners the
# ai-infra modules (src.pipeline.doc_redaction_gate / src.lib.secret_patterns) are
# NOT present in this repo, so the guard degrades gracefully to a gitleaks-only
# whole-tree scan — still real coverage. Self-contained: pins gitleaks, needs no
# repo secrets. Findings are reported as fingerprints only — never a raw secret.
#
# SCOPE, as of 2026-08-26: THE WHOLE TRACKED TREE -- every tracked file, no
# suffix filter. It was `docs/solutions/**/*.md`, which does not exist in this
# repo, so the guard scanned ZERO files while reporting a clean build.
#
# Why fixed rather than removed, when the other zero-scope carriers were removed:
# this repo is PUBLIC with an UNPROTECTED default branch. A secret that lands in
# any tracked file here is world-readable the instant it is pushed, with no
# privacy buffer -- and until now a green check sat beside it implying secrets
# had been checked. A passing check that means nothing is worse here than on a
# private repo. The repo is ~37 KB of pure Python across 8 tracked files, so
# there is no cost argument against scanning all of it.
#
# Being public also raises the stakes in the other direction: an Actions log on
# this repo is world-readable too. The guard reports FINGERPRINTS ONLY and never
# a raw secret value (gitleaks writes its report to a temp file that is never
# echoed; the `Secret` field is hashed and discarded at parse time), and that
# property was re-verified against the widened scope before this landed.
#
# The scope lives in SCOPE_ROOTS / SCOPE_SUFFIXES in the guard script; this
# comment is a pointer, not a second source of truth.
name: soldoc-secret-guard

# PATH FILTERS REMOVED 2026-08-26. The guard's scope here is the WHOLE tracked
# tree, so any filter narrower than "everything" would let a commit change a
# scanned file without triggering the scan. A path filter and a scan scope have
# to agree, and the only filter that agrees with "everything" is none.
#
# `pull_request` is kept (unlike ai-infra, which dropped it): this repo is
# PUBLIC, so an outside contributor's PR arrives from a fork, and a fork head is
# not covered by the `push` trigger at all. The duplicate-run cost of keeping it
# is addressed by the separate `ci/soldoc-single-fire` PR, not here.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  soldoc-secret-guard:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Downloading $url"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version

      - name: Scan all solution docs for residual secrets
        env:
          # On a GitHub-hosted runner ai-infra is NOT checked out, so this is a
          # documented no-op: the guard cannot import the authoritative scan and
          # degrades to a gitleaks-only whole-tree scan. Kept for parity with the
          # ai-infra source workflow and so a self-hosted runner that DOES have
          # ai-infra could point it at that checkout for full coverage.
          AI_INFRA_ROOT: /home/goduk/ai-infra
        run: |
          set -euo pipefail
          # Point the guard at the pinned gitleaks ($HOME is expanded here, not
          # in the env: block above).
          export DOC_GATE_GITLEAKS_BIN="$HOME/.local/bin/gitleaks"
          # The guard prints its OWN verdict, and that verdict carries the
          # DENOMINATOR: "scanned N files -- all clean", or a loud, differently
          # worded zero-file line plus a ::warning annotation. The hardcoded
          # `echo "...all tracked solution docs are clean."` that used to sit
          # here was removed 2026-08-26: it printed the identical sentence
          # whether the scan examined 0 files or 3,988, so a guard aimed at an
          # empty path was byte-indistinguishable from one that looked and found
          # nothing. Never re-add a fixed success string here -- a verdict must
          # come from the thing that did the work.
          python3 scripts/precommit-soldoc-secret-guard.py --all
